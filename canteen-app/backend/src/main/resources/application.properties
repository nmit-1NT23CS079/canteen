server.port=8080
spring.application.name=canteen

# Externalized configuration (Unit 4)
spring.datasource.url=jdbc:h2:mem:canteen;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Spring Data REST: only repositories annotated with @RepositoryRestResource are exported
spring.data.rest.base-path=/data
spring.data.rest.detection-strategy=annotated

# Custom properties injected with @Value
canteen.gst-rate=0.05
canteen.discount-threshold=500
canteen.discount-rate=0.10

# Logging (Unit 4)
logging.level.root=INFO
logging.level.com.nmit.canteen=DEBUG
